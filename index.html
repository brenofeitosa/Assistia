<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssistIA - Plataforma de Atendimento & Automação Inteligente</title>
  <style>
/* ==========================================================================
   AssistIA - Design System & SaaS Modern Layout (Pure CSS)
   ========================================================================== */

:root {
  /* Color Palette */
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #eef2ff;
  --secondary: #64748b;
  
  --bg-main: #f8fafc;
  --bg-card: #ffffff;
  --sidebar-bg: #0f172a;
  --sidebar-text: #94a3b8;
  --sidebar-active: #ffffff;
  
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border-color: #e2e8f0;
  
  --success: #10b981;
  --success-bg: #d1fae5;
  --warning: #f59e0b;
  --warning-bg: #fef3c7;
  --danger: #ef4444;
  --danger-bg: #fee2e2;
  --purple: #8b5cf6;
  --purple-bg: #f3e8ff;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  
  --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* Reset & Global */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-main);
  color: var(--text-main);
  line-height: 1.5;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* Typography Utilities */
h1, h2, h3, h4 {
  color: var(--text-main);
  font-weight: 600;
}

p {
  color: var(--text-muted);
}

.text-muted { color: var(--text-muted) !important; }
.text-danger { color: var(--danger) !important; }
.text-amber { color: var(--warning) !important; }
.text-primary { color: var(--primary) !important; }
.text-purple { color: var(--purple) !important; }
.text-white { color: #ffffff !important; }
.small { font-size: 12px; }

/* Layout Structure */
.app-layout {
  display: flex;
  min-height: 100vh;
}

/* Mobile Header */
.mobile-header {
  display: none;
  background-color: var(--sidebar-bg);
  color: #fff;
  padding: 12px 20px;
  justify-content: space-between;
  align-items: center;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
}

.mobile-header .brand {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Sidebar */
.sidebar {
  width: 260px;
  background-color: var(--sidebar-bg);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 90;
  transition: transform 0.3s ease;
}

.sidebar-brand {
  padding: 24px 20px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.sidebar-brand .brand-icon {
  font-size: 22px;
  color: var(--primary);
}

.sidebar-brand h2 {
  color: #fff;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.sidebar-brand h2 span {
  color: var(--primary);
}

.badge-pro {
  background: rgba(79, 70, 229, 0.2);
  color: #818cf8;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.sidebar-company-info {
  margin: 16px;
  padding: 12px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  gap: 12px;
}

.company-avatar {
  width: 36px;
  height: 36px;
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.company-details {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.company-details strong {
  color: #fff;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.company-details span {
  font-size: 11px;
  color: #64748b;
}

.sidebar-nav {
  flex: 1;
  padding: 12px 10px;
  overflow-y: auto;
}

.sidebar-nav ul {
  list-style: none;
}

.sidebar-nav li {
  margin-bottom: 4px;
}

.sidebar-nav a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  color: var(--sidebar-text);
  text-decoration: none;
  font-weight: 500;
  border-radius: var(--radius-sm);
  transition: all 0.2s ease;
}

.sidebar-nav a:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
}

.sidebar-nav li.active a {
  background: var(--primary);
  color: #fff;
}

.nav-badge {
  margin-left: auto;
  background: var(--danger);
  color: #fff;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: 600;
}

.sidebar-footer {
  padding: 16px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.ai-status-card {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(16, 185, 129, 0.1);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(16, 185, 129, 0.2);
}

.status-indicator {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 8px var(--success);
}

.status-text small {
  display: block;
  color: #94a3b8;
  font-size: 10px;
  text-transform: uppercase;
}

.status-text strong {
  color: #10b981;
  font-size: 12px;
}

/* Main Content Area */
.main-content {
  flex: 1;
  margin-left: 260px;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  background: var(--bg-card);
  padding: 18px 32px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.topbar-title h1 {
  font-size: 22px;
  letter-spacing: -0.5px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 16px;
}

.user-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-main);
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border-color);
  font-weight: 500;
  font-size: 13px;
}

.user-status-dot {
  width: 8px;
  height: 8px;
  background: var(--success);
  border-radius: 50%;
}

.view-container {
  padding: 32px;
  flex: 1;
}

.view-content {
  display: none;
}

.view-content.active {
  display: block;
  animation: fadeIn 0.25s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Card Component */
.card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
}

.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-title {
  font-size: 16px;
  font-weight: 600;
}

.card-subtitle {
  font-size: 12px;
  color: var(--text-muted);
}

.card-body {
  padding: 20px;
}

/* Grids & Utility Containers */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 20px;
  display: flex;
  align-items: flex-start;
  gap: 16px;
  box-shadow: var(--shadow-sm);
}

.stat-icon {
  width: 46px;
  height: 46px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.icon-blue { background: #e0e7ff; color: var(--primary); }
.icon-green { background: var(--success-bg); color: var(--success); }
.icon-purple { background: var(--purple-bg); color: var(--purple); }
.icon-amber { background: var(--warning-bg); color: var(--warning); }
.icon-red { background: var(--danger-bg); color: var(--danger); }

.stat-data {
  display: flex;
  flex-direction: column;
}

.stat-label {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
  margin: 2px 0;
  letter-spacing: -0.5px;
}

.stat-trend {
  font-size: 11px;
  font-weight: 600;
}

.stat-trend.positive { color: var(--success); }
.stat-trend.neutral { color: var(--text-muted); }

.grid-2-col {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 24px;
}

.grid-2-col-responsive {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.bg-gradient-ai {
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  border: none;
}

.ai-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.tag-pill {
  background: rgba(255,255,255,0.2);
  color: #fff;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 12px;
}

/* Activity List */
.activity-list {
  list-style: none;
}

.activity-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border-color);
}

.activity-item:last-child {
  border-bottom: none;
}

.activity-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary-light);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

.activity-content {
  flex: 1;
}

.activity-content p {
  color: var(--text-main);
  font-size: 13px;
}

.activity-time {
  font-size: 11px;
  color: var(--text-muted);
}

/* Alert Items */
.alert-stock-card {
  background: var(--warning-bg);
  border: 1px solid rgba(245, 158, 11, 0.3);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.alert-stock-card strong {
  font-size: 13px;
  color: #92400e;
}

.alert-stock-card span {
  font-size: 11px;
  color: #b45309;
}

/* Tables */
.table-responsive {
  overflow-x: auto;
}

.table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.table th {
  background: #f8fafc;
  padding: 12px 18px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-color);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.table td {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-color);
  font-size: 13px;
}

.table tr:hover {
  background: #f1f5f9;
}

.text-right { text-align: right; }

/* Badges & Status */
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}

.badge-success { background: var(--success-bg); color: #065f46; }
.badge-warning { background: var(--warning-bg); color: #92400e; }
.badge-danger { background: var(--danger-bg); color: #991b1b; }
.badge-purple { background: var(--purple-bg); color: #5b21b6; }
.badge-neutral { background: #f1f5f9; color: var(--text-muted); }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 600;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover { background: var(--primary-hover); }

.btn-secondary {
  background: #e2e8f0;
  color: var(--text-main);
}
.btn-secondary:hover { background: #cbd5e1; }

.btn-purple {
  background: var(--purple);
  color: #fff;
}
.btn-purple:hover { background: #7c3aed; }

.btn-light {
  background: #fff;
  border-color: var(--border-color);
  color: var(--text-main);
}
.btn-light:hover { background: #f8fafc; }

.btn-danger {
  background: var(--danger);
  color: #fff;
}
.btn-danger:hover { background: #dc2626; }

.btn-outline-warning {
  border: 1px solid var(--warning);
  color: #b45309;
  background: transparent;
}
.btn-outline-warning:hover { background: var(--warning-bg); }

.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-xs { padding: 4px 8px; font-size: 11px; }
.btn-block { width: 100%; }

.btn-icon {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  padding: 6px;
  border-radius: var(--radius-sm);
}
.btn-icon:hover { background: var(--border-color); color: var(--text-main); }

/* Toolbars */
.toolbar-card {
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.toolbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
}

.search-input-wrapper {
  position: relative;
  flex: 1;
  max-width: 320px;
}

.search-input-wrapper i {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
}

.search-input-wrapper input {
  width: 100%;
  padding: 8px 12px 8px 36px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  font-size: 13px;
}

/* Form Elements */
.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-main);
}

.form-control {
  width: 100%;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  font-size: 13px;
  font-family: var(--font-sans);
  background: #fff;
}

.form-control:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

/* Chat Central Interface */
.chat-container {
  display: grid;
  grid-template-columns: 320px 1fr;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  height: calc(100vh - 160px);
  overflow: hidden;
}

.chat-sidebar {
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  background: #f8fafc;
}

.chat-search-box {
  padding: 12px;
  position: relative;
}

.chat-search-box .search-icon {
  position: absolute;
  left: 22px;
  top: 22px;
  color: var(--text-muted);
}

.chat-search-box input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  font-size: 12px;
}

.chat-filter-tabs {
  display: flex;
  padding: 0 12px 10px;
  gap: 4px;
  border-bottom: 1px solid var(--border-color);
}

.filter-btn {
  background: transparent;
  border: none;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  color: var(--text-muted);
  font-weight: 500;
}

.filter-btn.active {
  background: #e2e8f0;
  color: var(--text-main);
  font-weight: 600;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-color);
  cursor: pointer;
  transition: background 0.15s;
}

.chat-item:hover, .chat-item.active {
  background: #ffffff;
}

.chat-item.active {
  border-left: 4px solid var(--primary);
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--primary-light);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}

.chat-item-info {
  flex: 1;
  overflow: hidden;
}

.chat-item-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 2px;
}

.chat-item-top strong {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-item-top .time {
  font-size: 10px;
  color: var(--text-muted);
}

.chat-item-preview {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-main {
  display: flex;
  flex-direction: column;
  background: #f1f5f9;
}

.chat-header {
  padding: 12px 20px;
  background: #fff;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chat-header-user {
  display: flex;
  align-items: center;
  gap: 12px;
}

.chat-messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message-bubble {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.4;
  position: relative;
  box-shadow: var(--shadow-sm);
}

.message-client {
  align-self: flex-start;
  background: #ffffff;
  color: var(--text-main);
  border-bottom-left-radius: 2px;
}

.message-ai {
  align-self: flex-end;
  background: #e0e7ff;
  color: #1e1b4b;
  border-bottom-right-radius: 2px;
  border: 1px solid rgba(79, 70, 229, 0.2);
}

.message-ai .ai-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: var(--primary);
  font-weight: 700;
  margin-bottom: 4px;
  text-transform: uppercase;
}

.message-time {
  display: block;
  font-size: 9px;
  color: var(--text-muted);
  text-align: right;
  margin-top: 4px;
}

.chat-quick-suggestions {
  background: #ffffff;
  padding: 8px 16px;
  border-top: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
}

.chip-btn {
  background: #f1f5f9;
  border: 1px solid var(--border-color);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 16px;
  cursor: pointer;
  white-space: nowrap;
}
.chip-btn:hover { background: #e2e8f0; }

.chat-input-area {
  padding: 12px 16px;
  background: #fff;
  border-top: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chat-input-area textarea {
  width: 100%;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  resize: none;
  font-family: var(--font-sans);
  font-size: 13px;
}

.chat-input-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

/* Ensinar IA & Knowledge List */
.knowledge-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.knowledge-item {
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  background: var(--bg-main);
  position: relative;
}

.knowledge-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.knowledge-header strong {
  font-size: 13px;
  color: var(--primary);
}

/* (file continues unchanged) */
  </style>
  
</head>
